    topic_relations:
      - relation_id: REL-001
        topic_id: control-law-design
        scope: Fuller Block 25 DFCS reference structure reproduced and described by the thesis.
        locator: {type: pdf, asset_id: PDF-001, page_start: 37, page_end: 49, section: III}
        applies_to:
          aircraft: F-16 reference, not F-CK-1C
          configuration: Block 25 DFCS reference paired with an F-16A OHT simulation context.
          period: December 1987 thesis; underlying reference 22 date not stated.
          conditions: Distinguish the fuller diagrams from the subsequently simplified controller.
          limitations:
            - Original reference 22 was not independently retrieved or validated.
            - Foldouts are split across scan pages; several labels remain unclear.
            - No F-CK-1C architecture or parameters are established.
        directness:
          grade: E2
          reason: Traceable secondary presentation of F-16 SPO-supplied reference 22, not independent access to that original.
        relevance:
          grade: R3
          reason: A comparable fighter flight-control problem on another aircraft; common era alone does not establish transferability.
        assessed_by: Codex
        assessed_at: '2026-10-24'
      - relation_id: REL-002
        topic_id: control-law-design
        scope: The thesis author's fixed-condition controller simplifications, gains, and stated assumptions.
        locator: {type: pdf, asset_id: PDF-001, page_start: 50, page_end: 55, section: III}
        applies_to:
          aircraft: F-16A simulation, not F-CK-1C
          configuration: OHT clean aerodynamic context, wingtip AIM-9; simplified Block 25 DFCS.
          period: December 1987 thesis.
          conditions: Mach 0.9, altitude 20000 ft; no landing/refueling/high-rate configuration claims.
          limitations:
            - Fixed gains and omitted limiters/filters are simulation assumptions, not full aircraft behavior.
            - The thesis holds leading-edge flap deflection at zero.
            - No basis to adopt these coefficients or simplifications as F-CK-1C settings.
        directness:
          grade: E1
          reason: Primary account of the author's own simplification, not primary evidence of an operational aircraft's complete controller.
        relevance:
          grade: R3
          reason: Useful comparative control-model design with explicit differences and a narrow nominal condition.
        assessed_by: Codex
        assessed_at: '2026-10-24'
      - relation_id: REL-003
        topic_id: flight-simulation-validation
        scope: Reported closed-loop response tests, initial conditions, and validation limitations.
        locator: {type: pdf, asset_id: PDF-001, page_start: 89, page_end: 129, section: VI}
        applies_to:
          aircraft: F-16A OHT simulation with AFTI/F-16 comparison material.
          configuration: Coupled and inertially uncoupled models with the simplified DFCS.
          period: December 1987 thesis.
          conditions: Mach 0.9, 20000 ft, one-g wings-level nonaccelerating nominal condition.
          limitations:
            - External reference 19 and raw comparison responses were not independently verified here.
            - Closed-loop response examples do not establish full-envelope or human-pilot validation.
            - The source reports rudder-pedal plot polarity errors.
        directness:
          grade: E1
          reason: Primary evidence of the author's test method and reported results, not independently verified flight-test ground truth.
        relevance:
          grade: R3
          reason: A useful simulation-validation comparison on a different aircraft and historical platform.
        assessed_by: Codex
        assessed_at: '2026-10-24'
      - relation_id: REL-004
        topic_id: flight-simulation-validation
        scope: Original real-time objectives and reported computation/display limitations.
        locator: {type: pdf, asset_id: PDF-001, page_start: 26, page_end: 36, section: II}
        applies_to:
          aircraft: F-16A research simulator.
          configuration: Two EAI SIMSTAR hybrid computers and a provisional cockpit.
          period: December 1987 hardware/software configuration.
          conditions: Reported desired cycle around 15 ms versus slower lookup/control routines.
          limitations:
            - Historical hardware timing is not an aircraft DFCS frequency specification.
            - Real-time man-in-the-loop performance was not achieved in the thesis.
        directness:
          grade: E1
          reason: Author's primary account of implemented hardware limitations and unmet objectives.
        relevance:
          grade: R3
          reason: Comparable end-to-end simulation-timing concern, but hardware and implementation differ materially.
        assessed_by: Codex
        assessed_at: '2026-10-24'
      - relation_id: REL-005
        topic_id: flight-simulation-validation
        scope: Bibliographic provenance and availability/validity limits of the comparison responses, external code, and aerodynamic data.
        locator: {type: pdf, asset_id: PDF-001, page_start: 178, page_end: 182, section: Appendix E and bibliography}
        applies_to:
          aircraft: F-16A OHT SIMTACS reproduction.
