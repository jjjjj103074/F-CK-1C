name: C++ Format Check

on:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  cpp-format:
    name: Verify C++ formatting
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install development tools
        run: npm ci
      - name: Test formatter workflow
        run: npm run test:cpp-format
      - name: Check authored C++ sources and tests
        run: npm run check:cpp-format
