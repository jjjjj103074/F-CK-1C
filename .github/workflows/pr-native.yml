name: PR 驗證

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  validation:
    name: PR
    if: github.event.action != 'edited' || github.event.changes.base
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-native-checks.yml
