name: Radar graphical test bundle

on:
  push:
    branches: [ci/radar-test-guide-20261120]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VALIDATION_RUN: '44688880801'
      VALIDATED_SOURCE: 34dbddf0df70d4650bf69d1a9a4c7732f1052c75
    steps:
      - name: Check out flight-test tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check test-bundle tooling
        run: python3 -m unittest discover -s tools/mc-flight-test -p 'test_*.py'
      - name: Verify the source build passed
        shell: bash
        run: |
          python3 - <<'CHECK'
          import json, os, subprocess, time
          endpoint = 'repos/' + os.environ['GH_REPO'] + '/actions/runs/' + os.environ['VALIDATION_RUN']
          for attempt in range(30):
              try:
                  info = json.loads(subprocess.check_output(['gh', 'api', endpoint], timeout=25))
              except (subprocess.SubprocessError, ValueError):
                  time.sleep(20)
                  continue
              assert info['head_sha'] == os.environ['VALIDATED_SOURCE'], 'Unexpected DLL source'
              if info['status'] == 'completed':
                  assert info['conclusion'] == 'success', 'DLL validation did not pass'
                  break
              time.sleep(20)
          else:
              raise SystemExit('Timed out waiting for DLL validation')
          CHECK
      - name: Download the validated module and manifest
        shell: bash
        run: |
          gh run download "$VALIDATION_RUN" -n "mc-module-$VALIDATED_SOURCE" -D "$RUNNER_TEMP/base-module"
          gh run download "$VALIDATION_RUN" -n "mc-validated-$VALIDATED_SOURCE" -D "$RUNNER_TEMP/validated"
      - name: Assemble the radar test bundle
        shell: bash
        run: |
          python3 tools/mc-flight-test/package_test_bundle.py --module-zip "$RUNNER_TEMP/base-module/F-CK-1C-mc-${VALIDATED_SOURCE:0:8}.zip" --manifest "$RUNNER_TEMP/validated/manifest.json" --catalog src/efm/F-CK-1C_EFM/DcsIds/CommandIds.json --expected-source "$VALIDATED_SOURCE" --test-tools-source "$GITHUB_SHA" --focus radar --output dist/radar-flight-test
      - name: Upload the radar flight-test bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radar-flight-test-${{ github.sha }}
          path: |
            dist/radar-flight-test/F-CK-1C-radar-flight-test-*.zip
            dist/radar-flight-test/F-CK-1C-radar-flight-test-*.zip.sha256
          if-no-files-found: error
          retention-days: 7
