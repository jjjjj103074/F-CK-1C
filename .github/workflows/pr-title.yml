name: PR Title Check

# Validate that the PR title follows the project's commit message convention.
# When using Squash merge, the PR title becomes the squashed commit message,
# so enforcing the title format is sufficient.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]

jobs:
  commitlint:
    name: Validate PR title format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate PR title against commitlint rules
        run: echo "${{ github.event.pull_request.title }}" | ./node_modules/.bin/commitlint --no-color
