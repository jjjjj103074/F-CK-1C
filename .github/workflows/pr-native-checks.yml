name: PR 原生檢查

on:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: efm-pr-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-metadata-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  pr-submission:
    name: 提交檢查
    needs: validation-plan
    runs-on: ${{ needs.validation-plan.outputs.mode == 'reuse' && 'ubuntu-latest' || 'windows-2025-vs2026' }}
    timeout-minutes: 20
    env:
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: 沿用提交結果
        if: needs.validation-plan.outputs.mode == 'reuse'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_URL: ${{ needs.validation-plan.outputs.sourceUrl }}
          SOURCE_LABEL: ${{ needs.validation-plan.outputs.sourceLabel }}
        with:
          script: |
            await core.summary.addHeading('提交檢查').addLink('沿用 ' + process.env.SOURCE_LABEL, process.env.SOURCE_URL).addRaw('；未重新建置。').write();
      - name: 取出提交版本
        if: needs.validation-plan.outputs.mode == 'full'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/efm/
            /tools/
            /Cockpit/
            /Input/
            /FM/
            /bin/F-CK-1C_EFM.dll
            /package.json
            /package-lock.json
            /commitlint.config.js
            /.github/workflows/pr-native.yml
            /.github/workflows/pr-native-checks.yml
            /.github/workflows/pr-title.yml
            /.github/workflows/pr-title-checks.yml
            /.github/workflows/pr-rule-notice.yml
            /.clang-format
            /_clang-format
            /.clang-format-ignore
            /src/.clang-format
            /src/_clang-format
            /src/.clang-format-ignore
            /.gitattributes
            /.gitignore
      - name: 準備 Node.js
        if: needs.validation-plan.outputs.mode == 'full'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 規劃檢查
        if: needs.validation-plan.outputs.mode == 'full'
        id: plan
        shell: pwsh
        run: |
          git fetch --no-tags --filter=blob:none origin $env:PR_BASE
          if ($LASTEXITCODE -ne 0) { throw '無法取得目標版本。' }
          node tools/pr-checks.mjs $env:PR_HEAD $env:PR_BASE Submission
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 安裝工具
        if: needs.validation-plan.outputs.mode == 'full' && (steps.plan.outputs.format == 'true' || steps.plan.outputs.tools == 'true')
        run: npm ci --ignore-scripts
      - name: 工具測試
        if: needs.validation-plan.outputs.mode == 'full' && steps.plan.outputs.tools == 'true'
        shell: pwsh
        run: |
          node --test tools/cpp-format.test.mjs tools/pr-rule-changes.test.mjs tools/pr-workflow.test.mjs tools/pr-checks.test.mjs tools/pr-results.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: C++ 排版
        if: needs.validation-plan.outputs.mode == 'full' && steps.plan.outputs.format == 'true'
        shell: pwsh
        run: |
          node tools/cpp-format.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: DLL 與原生測試
        if: needs.validation-plan.outputs.mode == 'full'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/validate_efm.ps1 -Phase Submission -Checks '${{ steps.plan.outputs.checks }}' -ExpectedHead $env:PR_HEAD -ReportDirectory "$env:RUNNER_TEMP\efm-submission"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 保存失敗紀錄
        if: failure() && needs.validation-plan.outputs.mode == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: efm-submission-diagnostics
          retention-days: 3
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/efm-submission/*.json
            ${{ runner.temp }}/efm-submission/*.md
            ${{ runner.temp }}/efm-submission/*.log

  merge-compatibility:
    name: 合併檢查
    needs: [validation-plan, pr-submission]
    runs-on: ${{ needs.validation-plan.outputs.mode == 'reuse' && 'ubuntu-latest' || 'windows-2025-vs2026' }}
    timeout-minutes: 20
    env:
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: 沿用合併結果
        if: needs.validation-plan.outputs.mode == 'reuse'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_URL: ${{ needs.validation-plan.outputs.sourceUrl }}
          SOURCE_LABEL: ${{ needs.validation-plan.outputs.sourceLabel }}
        with:
          script: |
            await core.summary.addHeading('合併檢查').addLink('沿用 ' + process.env.SOURCE_LABEL, process.env.SOURCE_URL).addRaw('；未重新建置。').write();
      - name: 取出提交與歷史
        if: needs.validation-plan.outputs.mode == 'full'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/efm/
            /tools/
            /FM/
            /bin/F-CK-1C_EFM.dll
            /.gitattributes
            /.gitignore
      - name: 準備 Node.js
        if: needs.validation-plan.outputs.mode == 'full'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 規劃檢查
        if: needs.validation-plan.outputs.mode == 'full'
        id: plan
        shell: pwsh
        run: |
          git fetch --no-tags --filter=blob:none origin $env:PR_BASE
          if ($LASTEXITCODE -ne 0) { throw '無法取得目標版本。' }
          node tools/pr-checks.mjs $env:PR_HEAD $env:PR_BASE Merge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 模擬合併
        if: needs.validation-plan.outputs.mode == 'full'
        shell: pwsh
        run: |
          if ($env:PR_HEAD -notmatch '^[a-f0-9]{40}$' -or $env:PR_BASE -notmatch '^[a-f0-9]{40}$') { throw '提交版本格式錯誤。' }
          git config user.name 'EFM CI'
          git config user.email 'efm-ci@users.noreply.github.com'
          ./tools/prepare_efm_merge.ps1 -HeadSha $env:PR_HEAD -BaseSha $env:PR_BASE -OutputDirectory "$env:RUNNER_TEMP\efm-prepared-merge"
      - name: DLL 與原生測試
        if: needs.validation-plan.outputs.mode == 'full'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\efm-prepared-merge\controller\validate_efm.ps1" -Phase Merge -Checks '${{ steps.plan.outputs.checks }}' -RepoRoot "$env:GITHUB_WORKSPACE" -ExpectedHead $env:PR_HEAD -SubmittedDllPath "$env:RUNNER_TEMP\efm-prepared-merge\pr-uploaded.dll" -ReportDirectory "$env:RUNNER_TEMP\efm-merge"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 保存失敗紀錄
        if: failure() && needs.validation-plan.outputs.mode == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: efm-merge-diagnostics
          retention-days: 3
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/efm-merge/*.json
            ${{ runner.temp }}/efm-merge/*.md
            ${{ runner.temp }}/efm-merge/*.log

  validation-summary:
    name: 檢查結果
    if: always()
    needs: [validation-plan, pr-submission, merge-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      SUBMISSION_RESULT: ${{ needs.pr-submission.result }}
      MERGE_RESULT: ${{ needs.merge-compatibility.result }}
      VALIDATION_MODE: ${{ needs.validation-plan.outputs.mode }}
      SOURCE_RUN: ${{ needs.validation-plan.outputs.sourceRun }}
    steps:
      - name: 取出驗證工具
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /tools/pr-results.mjs
      - name: 確認結果與版本
        id: result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {finishValidation} = await import(require('node:url').pathToFileURL(process.env.GITHUB_WORKSPACE + '/tools/pr-results.mjs').href);
            await finishValidation({github, context, core});
      - name: 保存版本憑證
        if: success() && needs.validation-plan.outputs.mode == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.result.outputs.receipt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/native-validation.json

  validation-plan:
    name: 規劃驗證
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sourceRun: ${{ steps.plan.outputs.sourceRun }}
      sourceUrl: ${{ steps.plan.outputs.sourceUrl }}
      sourceLabel: ${{ steps.plan.outputs.sourceLabel }}
    steps:
      - name: 取出驗證工具
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /tools/pr-results.mjs
      - name: 查證既有結果
        id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {planValidation} = await import(require('node:url').pathToFileURL(process.env.GITHUB_WORKSPACE + '/tools/pr-results.mjs').href);
            await planValidation({github, context, core});
      - name: 完整驗證
        if: steps.plan.outputs.mode == 'full'
        run: echo '執行完整驗證'
      - name: 沿用有效結果
        if: steps.plan.outputs.mode == 'reuse'
        run: echo '已查證原始驗證結果'
