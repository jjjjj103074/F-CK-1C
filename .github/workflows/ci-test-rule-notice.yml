name: 規則變更（測試）

on:
  pull_request:
    branches: ['codex/ci-test-base-20261014']
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: efm-rule-notice-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rule-notice:
    name: 變更提醒
    if: ${{ github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 標示測試入口
        run: echo "測試入口；正式部署見開發文件。" >> "$GITHUB_STEP_SUMMARY"
      # Use the target branch notice script.
      - name: 取出目標版本
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: tools
      - name: 準備 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 更新變更提醒
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/pr-rule-changes.mjs
