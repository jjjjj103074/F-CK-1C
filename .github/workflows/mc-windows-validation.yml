name: MC flight-test recording package
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the flight-test tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retrieve the completely validated module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44554521214 --repo "$GITHUB_REPOSITORY" --name mc-module-dbc72e624373583c306c519d93584e64945dc5b8 --dir validated-module
          gh run download 44554521214 --repo "$GITHUB_REPOSITORY" --name mc-validated-dbc72e624373583c306c519d93584e64945dc5b8 --dir validated-dll
      - name: Check the recording tools and assemble the flight-test package
        run: |
          python3 tools/mc-flight-test/test_package.py
          python3 tools/mc-flight-test/package_test_bundle.py --module-zip validated-module/F-CK-1C-mc-dbc72e62.zip --manifest validated-dll/manifest.json --catalog src/efm/F-CK-1C_EFM/DcsIds/CommandIds.json --expected-source dbc72e624373583c306c519d93584e64945dc5b8 --test-tools-source "$GITHUB_SHA" --output dist/cm-recording
          python3 - <<'VERIFY'
          import json,zipfile,hashlib
          from pathlib import Path
          archive=next(Path('dist/cm-recording').glob('*.zip'))
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              build=json.loads(z.read('BUILD.json'))
              schema=z.read('F-CK-1C/Cockpit/Scripts/MCFlightTest/Parameters.lua').decode()
              catalog=json.loads(Path('src/efm/F-CK-1C_EFM/DcsIds/CommandIds.json').read_text())
              required=[p['value'] for p in catalog['cockpit_params'] if p['name'].startswith('Cm')]
              assert len(required)==10
              assert all(name in schema for name in required)
              assert hashlib.sha256(z.read('F-CK-1C/bin/F-CK-1C_EFM.dll')).hexdigest()==build['dll_sha256']
              assert build['source_commit']=='dbc72e624373583c306c519d93584e64945dc5b8'
          print('All ten CMS fields recorded; validated DLL unchanged.')
          VERIFY
      - name: Upload the completed flight-test package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mc-flight-test-cms-dbc72e62
          path: |
            dist/cm-recording/F-CK-1C-mc-flight-test-*.zip
            dist/cm-recording/F-CK-1C-mc-flight-test-*.zip.sha256
          if-no-files-found: error
          retention-days: 7
